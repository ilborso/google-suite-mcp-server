[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "google-suite-mcp-server"
version = "1.0.0"
description = "Google Suite MCP Server - Powered by ilborso Apify Actors"
readme = "README.md"
authors = [
    { name = "ilborso" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "apify>=2.0.0",
    "apify-client>=1.8.0",
    "mcp>=1.3.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
google-suite-mcp-server = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
